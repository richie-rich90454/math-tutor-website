<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="authLoginTitle">Sign in</title>
<link rel="stylesheet" href="/legacy/css/style.css">
</head>
<body>
<div class="legacy-shell">
    <div class="legacy-header">
        <span class="brand">MathTutor AI</span>
        <span class="right">
            <span id="langSwitcher"></span>
            <span> | </span>
            <a href="/legacy/index.html" data-i18n="navBackToApp">Back to app</a>
        </span>
    </div>

    <div class="auth-page">
        <h1 class="auth-heading" data-i18n="authLoginTitle">Welcome back</h1>
        <p class="auth-subtext" data-i18n="authLoginSubtitle">Sign in to continue your math journey</p>

        <form id="loginForm">
            <div class="field">
                <label for="email" data-i18n="authEmail">Email</label>
                <input type="text" id="email" data-i18n-placeholder="authEmailPlaceholder">
            </div>
            <div class="field">
                <label for="password" data-i18n="authPassword">Password</label>
                <input type="password" id="password" data-i18n-placeholder="authPasswordPlaceholder">
            </div>
            <div class="field">
                <label><input type="checkbox" id="remember"> <span data-i18n="authRememberMe">Remember me</span></label>
            </div>
            <div class="auth-msg hidden" id="errorBox"></div>
            <button type="submit" class="btn btn-primary" id="submitBtn" data-i18n="authSignIn">Sign in</button>
        </form>

        <p style="margin-top:16px; text-align:center;">
            <a href="#" id="guestBtn" class="btn" data-i18n="tryGuest">Try without an account</a>
        </p>

        <p class="auth-footer-text" style="margin-top:16px;">
            <span data-i18n="authNoAccount">Don't have an account?</span>
            <a href="/legacy/signup.html" data-i18n="authCreateOne">Create one</a>
        </p>
    </div>
</div>

<script src="/legacy/js/json2.min.js"></script>
<script src="/legacy/js/jquery-1.12.4.min.js"></script>
<script src="/legacy/js/config.js"></script>
<script src="/legacy/js/i18n.js"></script>
<script src="/legacy/js/common.js"></script>
<script src="/legacy/js/login.js"></script>
</body>
</html>
