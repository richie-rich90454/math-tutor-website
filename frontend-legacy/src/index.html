<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MathTutor AI — Legacy</title>
    <link rel="stylesheet" href="styles/legacy.css">
    <!--[if lt IE 7]>
    <style>
        .clearfix { height: 1%; }
    </style>
    <![endif]-->
</head>
<body>
    <div id="app">
        <div id="header">
            <h1 id="logo">MathTutor AI</h1>
        </div>
        <div id="main">
            <div id="welcome">
                <h2 id="welcome-title">MathTutor AI</h2>
                <p id="welcome-subtitle">Your personal math tutor. Ask any question and get step-by-step explanations.</p>
                <div id="input-wrapper">
                    <form id="chat-form">
                        <table id="input-table">
                            <tr>
                                <td id="input-cell">
                                    <textarea id="message-input" rows="2" placeholder="Ask a math question..."></textarea>
                                </td>
                                <td id="send-cell">
                                    <button type="submit" id="send-btn">Send</button>
                                </td>
                            </tr>
                        </table>
                    </form>
                </div>
                <div id="prompts">
                    <button class="prompt-btn" data-text="Solve for x: 2x + 5 = 13">2x + 5 = 13</button>
                    <button class="prompt-btn" data-text="Explain the Pythagorean theorem">Pythagorean theorem</button>
                    <button class="prompt-btn" data-text="What is a derivative?">What is a derivative?</button>
                    <button class="prompt-btn" data-text="Help me with fractions">Help with fractions</button>
                    <button class="prompt-btn-accent" data-text="Factor x^2 + 5x + 6">Factor x^2 + 5x + 6</button>
                </div>
            </div>
            <div id="chat-view" style="display:none;">
                <div id="messages-area">
                    <div id="messages-inner">
                        <div id="messages-list"></div>
                        <div id="loading" style="display:none;">
                            <span class="dot"></span>
                            <span class="dot"></span>
                            <span class="dot"></span>
                        </div>
                    </div>
                </div>
                <div id="input-bar">
                    <form id="chat-form-bottom">
                        <table id="input-bar-table">
                            <tr>
                                <td id="input-bar-cell">
                                    <textarea id="message-input-bottom" rows="2" placeholder="Ask a math question..."></textarea>
                                </td>
                                <td id="send-bar-cell">
                                    <button type="submit" id="send-btn-bottom">Send</button>
                                </td>
                            </tr>
                        </table>
                    </form>
                </div>
            </div>
        </div>
        <div id="footer">
            <p>MathTutor AI — built for everyone</p>
        </div>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <script src="scripts/legacy.js"></script>
</body>
</html>
